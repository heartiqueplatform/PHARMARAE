<head>

  <!-- Meta Tags for SEO & Social Sharing -->

    content="PHARMARAE KENYA - Comprehensive pharmacy management system for modern pharmacies. POS, inventory management, staff management, and real-time analytics." />

<!-- ✅ REMOVED fixed background colors - let the app control them -->

<body class="antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('✅ Service Worker registered successfully:', registration);
          })
          .catch(error => {
            console.error('❌ Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
