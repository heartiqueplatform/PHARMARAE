  <!-- ============================================ -->
  <!-- 🔥 ONE-TIME SW RESCUE — MUST BE FIRST -->
  <!-- Runs before React loads. Detects stuck users,     -->
  <!-- unregisters the stale SW, clears caches, and      -->
  <!-- reloads once so they get the fresh bundle.        -->
  <!-- ============================================ -->
  <script>
    (function () {
      try {
        var FIX_KEY = 'medp_sw_rescue_v1';
        if (localStorage.getItem(FIX_KEY) === 'done') return;
        if (!('serviceWorker' in navigator)) {
          localStorage.setItem(FIX_KEY, 'done');
          return;
        }
        navigator.serviceWorker.getRegistrations()
          .then(function (regs) {
            var hadStale = regs.length > 0;
            return Promise.all(regs.map(function (r) { return r.unregister(); }))
              .then(function () {
                if (typeof caches !== 'undefined') {
                  return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                  });
                }
              })
              .then(function () {
                localStorage.setItem(FIX_KEY, 'done');
                if (hadStale) {
                  console.log('[SW Rescue] Cleared stale SW, reloading...');
                  window.location.reload();
                }
              });
          })
          .catch(function () { localStorage.setItem(FIX_KEY, 'done'); });
      } catch (e) { /* silent */ }
    })();
  </script>
