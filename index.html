<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pharmienta Kenya — Oriented To Care</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
  <link rel="apple-touch-icon" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

  <!-- Meta Tags -->
  <!-- Theme color will be updated dynamically by main.tsx -->
  <meta name="theme-color" content="#f6f8fa" />
  <meta name="description"
    content="Pharmienta Kenya - Comprehensive pharmacy management system for modern pharmacies. POS, inventory management, staff management, and real-time analytics." />
  <meta name="keywords" content="pharmacy management, POS, inventory, healthcare, Kenya, Pharmienta" />
  <meta name="author" content="MEDRAE NURSING KENYA" />

  <!-- Open Graph -->
  <meta property="og:title" content="Pharmienta Kenya — Pharmacy Management System" />
  <meta property="og:description"
    content="Precision in Every Prescription. Modern pharmacy management system with POS, inventory, staff management, and real-time analytics." />
  <meta property="og:image" content="/pwa-192x192.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://Pharmienta.com" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pharmienta Kenya — Pharmacy Management System" />
  <meta name="twitter:description" content="Precision in Every Prescription. Modern pharmacy management system." />
  <meta name="twitter:image" content="/pwa-192x192.png" />

  <!-- PWA / Mobile -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pharmienta" />

  <!-- Color Scheme -->
  <meta name="color-scheme" content="light dark" />

  <!--  FIX: Minimal styles - Let main.tsx control theme -->
  <style>
    /* Default styles - theme will be applied by main.tsx */
    html,
    body,
    #root {
      min-height: 100vh;
      margin: 0;
      padding: 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .antialiased {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .selection\:bg-emerald-500::selection {
      background-color: #10b981 !important;
    }

    .selection\:text-white::selection {
      color: #ffffff !important;
    }

    #root {
      display: block;
      width: 100%;
    }

    /* Dark mode class - applied by main.tsx */
    body.dark-mode {
      background-color: #161b22 !important;
      color: #c9d1d9 !important;
    }

    /* Light mode default */
    body {
      background-color: #f6f8fa;
      color: #1f2328;
    }
  </style>
</head>

<body class="antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log(' Service Worker registered successfully:', registration);
          })
          .catch(error => {
            console.error('❌ Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>

</html>
